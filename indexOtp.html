<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup with Terms & OTP</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="form-container">
  <h2>Signup</h2>
  <form method="POST" action="verify_signup.php" id="signupForm">
    <input type="text" name="name" placeholder="Full Name" required />
    <input type="email" name="email" id="emailInput" placeholder="Email" required />
    <input type="password" name="password" placeholder="Password" required />

    <button type="button" onclick="sendOTP()">Send OTP</button>

    <input type="text" name="otp" id="otpInput" placeholder="Enter OTP" required />

    <div class="terms-section">
      <label>
        <input type="checkbox" id="termsCheckbox" /> I agree to the terms and conditions
      </label>
      <div class="handshake" id="handshakeContainer">
        <img id="handshakeImg" src="" alt="handshake gif" />
      </div>
    </div>

    <button type="submit" name="signup">Signup</button>
  </form>
  <div class="message" id="msgBox"></div>
</div>

<script>
function sendOTP() {
  const email = document.getElementById("emailInput").value;
  if (!email) return alert("Please enter your email");

  fetch("send_otp.php", {
    method: "POST",
    headers: {"Content-Type":"application/x-www-form-urlencoded"},
    body: "email=" + encodeURIComponent(email)
  })
  .then(res => res.text())
  .then(msg => document.getElementById("msgBox").innerText = msg)
  .catch(err => document.getElementById("msgBox").innerText = "❌ Error sending OTP");
}

const termsCheckbox = document.getElementById("termsCheckbox");
const handshakeImg = document.getElementById("handshakeImg");
termsCheckbox.addEventListener("change", () => {
  handshakeImg.src = termsCheckbox.checked ? "handshake.gif" : "reverse_handshake.gif";
  handshakeImg.style.display = "inline-block";
});
</script>

</body>
</html>
